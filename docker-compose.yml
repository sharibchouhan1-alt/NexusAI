# Local development infrastructure. Values come from .env (copy .env.example).
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nexusai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nexusai}
      POSTGRES_USER: ${DB_USER:-nexusai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
